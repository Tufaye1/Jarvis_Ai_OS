[project]
name = "jarvis-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "greenlet>=3.5.4",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Share a single event loop across the whole test session so the module-level
# async engine/session (app.db.engine) isn't handed asyncpg connections bound
# to a stale loop from a previous test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
